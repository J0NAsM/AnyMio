name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      # Keep every build product in the location consumed by NSIS and the
      # release/upload steps, regardless of runner defaults.
      CARGO_TARGET_DIR: target
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Verify tag version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME.TrimStart('v')
          $cargoVersion = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"$').Matches[0].Groups[1].Value
          if ($tagVersion -ne $cargoVersion) { throw "The tag version and Cargo.toml version must match." }
      - name: Verify source and build
        env:
          JREMOTE_UPDATE_MANIFEST_PUBLIC_KEY: ${{ vars.UPDATE_MANIFEST_PUBLIC_KEY }}
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked --all-targets
          cargo build --locked --release --bin JRemote --bin JRemoteUpdater
          cargo build --locked --release --bin JRemoteManifestSigner
          $requiredArtifacts = @(
            'target/release/JRemote.exe',
            'target/release/JRemoteUpdater.exe',
            'target/release/JRemoteManifestSigner.exe'
          )
          $missingArtifacts = $requiredArtifacts | Where-Object { -not (Test-Path -LiteralPath $_) }
          if ($missingArtifacts) {
            throw "Missing release artifact(s): $($missingArtifacts -join ', ')"
          }
      - name: Build installer
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" /DVERSION=$($env:GITHUB_REF_NAME.TrimStart('v')) installer/AnyMio.nsi
      - name: Optionally sign Windows artifacts
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:WINDOWS_CERTIFICATE_BASE64)) {
            Write-Host 'No signing certificate configured; publishing unsigned artifacts.'
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP 'anymio-signing.pfx'
          [System.IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_BASE64))
          $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password (ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force)
          Get-ChildItem target/release/JRemote.exe, target/release/JRemoteUpdater.exe, installer/AnyMio-Setup-$($env:GITHUB_REF_NAME.TrimStart('v')).exe | ForEach-Object { Set-AuthenticodeSignature -FilePath $_ -Certificate $certificate | Out-Null }
          Remove-Item -LiteralPath $pfxPath -Force
      - name: Build single-file portable edition
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          Copy-Item target\release\JRemote.exe "portable/AnyMio-Portable-$version.exe" -Force
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create $env:GITHUB_REF_NAME target/release/JRemote.exe target/release/JRemoteUpdater.exe installer/AnyMio-Setup-$($env:GITHUB_REF_NAME.TrimStart('v')).exe portable/AnyMio-Portable-$($env:GITHUB_REF_NAME.TrimStart('v')).exe --generate-notes --title "AnyMio $($env:GITHUB_REF_NAME)"
      - name: Publish update manifest
        shell: pwsh
        env:
          UPDATE_MANIFEST_SIGNING_PRIVATE_KEY: ${{ secrets.UPDATE_MANIFEST_SIGNING_PRIVATE_KEY }}
          UPDATE_MANIFEST_PUBLIC_KEY: ${{ vars.UPDATE_MANIFEST_PUBLIC_KEY }}
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $sha256 = (Get-FileHash target/release/JRemote.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $manifest = [ordered]@{
            version = $version
            url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/JRemote.exe"
            sha256 = $sha256
            notes = "Actualización automática publicada desde $env:GITHUB_REF_NAME."
          } | ConvertTo-Json
          git fetch origin main
          git checkout main
          [System.IO.File]::WriteAllText("update.json", "$manifest`n", [System.Text.UTF8Encoding]::new($false))
          if ([string]::IsNullOrWhiteSpace($env:UPDATE_MANIFEST_SIGNING_PRIVATE_KEY)) {
            if (-not [string]::IsNullOrWhiteSpace($env:UPDATE_MANIFEST_PUBLIC_KEY)) {
              throw 'UPDATE_MANIFEST_SIGNING_PRIVATE_KEY must be configured when UPDATE_MANIFEST_PUBLIC_KEY is set.'
            }
            Write-Host 'No manifest signing keys configured; publishing a SHA-256 verified manifest only.'
          } else {
            if ([string]::IsNullOrWhiteSpace($env:UPDATE_MANIFEST_PUBLIC_KEY)) {
              throw 'UPDATE_MANIFEST_PUBLIC_KEY must be configured when signing the update manifest.'
            }
            $privateKeyPath = Join-Path $env:RUNNER_TEMP 'update-manifest-private-key.txt'
            try {
              [System.IO.File]::WriteAllText($privateKeyPath, $env:UPDATE_MANIFEST_SIGNING_PRIVATE_KEY.Trim(), [System.Text.UTF8Encoding]::new($false))
              & target\release\JRemoteManifestSigner.exe --manifest update.json --private-key-file $privateKeyPath
              if ($LASTEXITCODE -ne 0) { throw 'The update manifest signer failed.' }
            } finally {
              Remove-Item -LiteralPath $privateKeyPath -Force -ErrorAction SilentlyContinue
            }
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          if (git diff --cached --quiet) { exit 0 }
          git commit -m "chore: publish update manifest for v$version"
          git push origin main
