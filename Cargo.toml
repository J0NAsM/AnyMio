[package]
name = "jremote"
version = "0.1.0"
default-run = "JRemote"
edition = "2024"
rust-version = "1.97"
description = "Visible, owner-operated remote desktop relay and endpoint"
license = "MIT"

[[bin]]
name = "JRemote"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
argon2 = "0.5"
clap = { version = "4.5", features = ["derive"] }
directories = "6.0"
ed25519-dalek = { version = "2.2", features = ["rand_core", "serde"] }
eframe = { version = "0.33", default-features = false, features = ["default_fonts", "glow"] }
futures-util = "0.3"
rand = "0.9"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
tokio = { version = "1.48", features = ["macros", "rt-multi-thread", "net", "io-util", "fs", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.18", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.23"

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
strip = true

[lints.rust]
unsafe_code = "forbid"
